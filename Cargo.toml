[package]
name = "bestofburst"
version = "0.3.1"
edition = "2021"
description = "Pick the best shots from a folder of photos. Offline, CPU only."
license-file = "LICENSE"
publish = false
authors = ["Ihan Hansaja"]
repository = "https://github.com/IHANsaja/BestOfBurst"

# SPEC-GAP: the spec asks for one binary crate. The package also exposes a
# library target (src/lib.rs) so the integration tests in tests/ can reach the
# engine; `cargo build --release` still produces exactly one bestofburst.exe.
[lib]
name = "bestofburst"
path = "src/lib.rs"

[[bin]]
name = "bestofburst"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
csv = "1.4.0"
ctrlc = "3.5.2"
eframe = "0.37.0"
fast_image_resize = "6.1.0"
# SPEC-GAP: the `jpeg` feature is added on top of the listed formats so the
# 320 px thumbnails can be encoded as JPEG (Desktop UI section).
image = { version = "0.25.10", default-features = false, features = ["png", "tiff", "webp", "bmp", "gif", "tga", "qoi", "pnm", "jpeg"] }
indicatif = "0.18.6"
jxl-oxide = "0.12.6"
kamadak-exif = "0.6.1"
memchr = "2.8.3"
memmap2 = "0.9.11"
pollster = "0.4"
rayon = "1.12.0"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
# Runs Google's MediaPipe face models (assets/models) on the CPU, pure Rust, no DLLs.
tract-tflite = "0.23.10"
# Runs the LaMa inpainting model (watermark edges, `src/inpaint.rs`), pure Rust too.
tract-onnx = "0.23.10"
# The LaMa model itself, built into the exe. SPEC-GAP: a second (data-only) crate, so its
# 200 MB are compiled once and not with every change to the program.
lama-model = { path = "crates/lama-model" }
# License key format and Ed25519 verification (verify-only; the signing half lives in the
# private crates/keygen tool, which is git-ignored and never built by the app).
license-core = { path = "crates/license-core" }
walkdir = "2.5.0"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Imaging", "Win32_System_Com", "Win32_System_Console", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_System_LibraryLoader", "Win32_System_Performance", "Win32_System_Registry"] }
zune-jpeg = "0.5.15"

[profile.release]
opt-level = 3
# Fat LTO inlines across crate boundaries, so the license checks dissolve into their callers
# instead of sitting in one tidy, patchable function. Slower to link, worth it for a release.
lto = "fat"
codegen-units = 1
# Strip symbols: ship no function names or debug info for a disassembler to lean on.
strip = "symbols"
# A panic aborts rather than unwinds — fewer landmarks in the binary, and a crash can't be
# caught and swallowed to skip a check.
panic = "abort"

# Decoding in debug builds is painfully slow; keep dependencies optimized.
[profile.dev.package."*"]
opt-level = 3
# Dependencies carry no debug symbols: with them, the test executables' PDB files outgrow what
# the MSVC linker accepts (LNK1318).
debug = false

[profile.test]
opt-level = 1

[build-dependencies]
winresource = "0.1.34"

[dev-dependencies]
# Checks that the built-in model is the published file.
sha2 = "0.10.9"
egui_kittest = { version = "0.37.0", features = ["wgpu", "eframe", "snapshot"] }
